<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S - My Stamps</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
    }

    .site-wrapper {
      max-width: 1000px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 4px 4px 0px #111111;
    }

    .top-banner h1 { 
      font-size: 2rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      color: #ffffff;
    }

    .stamps-note {
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 14px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: 3px 3px 0px #111111;
    }

    .filter-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #ffffff;
      color: #111111;
      border: 2px solid #111111;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 3px 3px 0px #111111;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #111111;
      background: #F3EEDA;
    }

    .filter-btn.active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #111111;
      background: #F3EEDA;
    }

    .gallery-scroll-area { 
      max-height: 600px; 
      overflow-y: auto; 
      padding-right: 5px;
    }

    .gallery-scroll-area::-webkit-scrollbar {
      width: 8px;
    }
    .gallery-scroll-area::-webkit-scrollbar-track {
      background: #f0f0f3;
      border-radius: 4px;
    }
    .gallery-scroll-area::-webkit-scrollbar-thumb {
      background: #111111;
      border-radius: 4px;
    }

    .stamp-section {
      display: none;
    }

    .stamp-section.active-section {
      display: block;
    }

    /* Griglia con riempimento intelligente (dense) per eliminare i buchi verticali mantenendo le dimensioni originali */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-auto-flow: dense;
      gap: 15px;
      align-items: start;
    }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      cursor: pointer;
    }

    .gallery-img {
      width: 100%;
      height: auto;
      display: block;
      border: none;
      box-shadow: none;
      background: transparent;
      transition: transform 0.2s ease, opacity 0.2s ease;
      opacity: 0.9;
    }

    .gallery-item:hover .gallery-img {
      transform: scale(1.03);
      opacity: 1;
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
      padding: 20px;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #ffffff;
      border: 3px solid #111111;
      border-radius: 20px;
      padding: 25px;
      max-width: 650px;
      width: 100%;
      display: flex;
      gap: 25px;
      box-shadow: 8px 8px 0px #111111;
      position: relative;
    }

    @media (max-width: 600px) {
      .modal-box {
        flex-direction: column;
        align-items: center;
      }
    }

    .modal-left {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-left img {
      max-width: 100%;
      max-height: 250px;
      border: none;
      box-shadow: none;
      background: transparent;
    }

    .modal-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
    }

    .modal-btn {
      background: #F3EEDA;
      color: #111111;
      border: 2px solid #111111;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.75rem;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      box-shadow: 3px 3px 0px #111111;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .modal-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #111111;
      background: #fff;
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.5rem;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="site-wrapper">

    <header class="top-banner">
      <h1>MY STAMPS</h1>
      <a href="https://seea-star.github.io/Cosmic-S-Home/" style="background:#F3EEDA; color:#111; border:2px solid #111; padding:8px 14px; border-radius:12px; font-weight:800; font-size:0.75rem; text-decoration:none; box-shadow:2px 2px 0px #111;"><- HOME</a>
    </header>

    <div class="stamps-note">
      Welcome to my stamp collection! Feel free to explore, collect your favorites, and decorate your own space with them.
    </div>

    <div class="filter-buttons">
      <button class="filter-btn active" onclick="showSection('all', event)">ALL</button>
      <button class="filter-btn" onclick="showSection('personal', event)">MY STYLE</button>
      <button class="filter-btn" onclick="showSection('others', event)">OTHER SITES</button>
    </div>

    <div class="gallery-scroll-area">
      
      <div id="section-all" class="stamp-section active-section">
        <div class="gallery-grid" id="grid-all"></div>
      </div>

      <div id="section-personal" class="stamp-section">
        <div class="gallery-grid" id="grid-personal"></div>
      </div>

      <div id="section-others" class="stamp-section">
        <div class="gallery-grid" id="grid-others"></div>
      </div>

    </div>

  </div>

  <div class="modal-backdrop" id="stampModal" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModalDirect()">×</button>
      <div class="modal-left">
        <img id="modalImg" src="" alt="Selected Stamp">
      </div>
      <div class="modal-right" id="modalRightContent"></div>
    </div>
  </div>

  <script>
    const personalStamps = [
      "stamp-5.png",
      "stamp-2.png",
      "stamp-3.png",
      "stamp-4.png",
      "stamp-7.png",
      "stamp-1.png",
      "stamp-6.png"
    ];

    const othersStamps = [
      "stamp-12.png",
      "stamp-13.png",
      "stamp-14.png",
      "stamp-15.png",
      "stamp-16.png",
      "stamp-17.png",
      "stamp-18.png",
      "stamp-19.png",
      "stamp-20.png",
      "stamp-9.png",
      "stamp-10.png",
      "stamp-11.png"
    ];

    const stampMetadata = {
      "stamp-12.png": { name: "Clover Star", url: "https://cloverstar.neocities.org/" },
      "stamp-13.png": { name: "Clover Star", url: "https://cloverstar.neocities.org/" },
      "stamp-14.png": { name: "Clover Star", url: "https://cloverstar.neocities.org/" },
      "stamp-15.png": { name: "Clover Star", url: "https://cloverstar.neocities.org/" },
      "stamp-16.png": { name: "Clover Star", url: "https://cloverstar.neocities.org/" },
      "stamp-17.png": { name: "Clover Star", url: "https://cloverstar.neocities.org/" },
      "stamp-18.png": { name: "Clover Star", url: "https://cloverstar.neocities.org/" },
      "stamp-19.png": { name: "Clover Star", url: "https://cloverstar.neocities.org/" },
      "stamp-20.png": { name: "Clover Star", url: "https://cloverstar.neocities.org/" },
      "stamp-9.png": { name: "GlassGoose", url: "https://glassgoose.neocities.org/" },
      "stamp-10.png": { name: "GlassGoose", url: "https://glassgoose.neocities.org/" },
      "stamp-11.png": { name: "GlassGoose", url: "https://glassgoose.neocities.org/" }
    };

    function populateGrid(containerId, list) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      
      list.forEach((fileName) => {
        let relativePath = "./" + fileName;
        let absoluteUrl = "https://seea-star.github.io/Cosmic-S-My-Stamps/" + fileName;

        let itemDiv = document.createElement("div");
        itemDiv.className = "gallery-item";
        itemDiv.onclick = () => openModal(absoluteUrl, relativePath, fileName);

        let img = document.createElement("img");
        img.src = relativePath;
        img.alt = "Stamp";
        img.className = "gallery-img";

        itemDiv.appendChild(img);
        container.appendChild(itemDiv);
      });
    }

    populateGrid("grid-personal", personalStamps);
    populateGrid("grid-others", othersStamps);
    populateGrid("grid-all", [...othersStamps, ...personalStamps]);

    function showSection(sectionName, event) {
      const sections = document.getElementsByClassName('stamp-section');
      for (let sec of sections) {
        sec.classList.remove('active-section');
      }

      const buttons = document.getElementsByClassName('filter-btn');
      for (let btn of buttons) {
        btn.classList.remove('active');
      }

      document.getElementById('section-' + sectionName).classList.add('active-section');
      event.currentTarget.classList.add('active');
    }

    let currentImgSrc = "";

    function openModal(imgSrc, imgPath, fileName) {
      currentImgSrc = imgSrc;
      document.getElementById('modalImg').src = imgPath;
      
      let rightContent = document.getElementById('modalRightContent');
      rightContent.innerHTML = "";

      if (stampMetadata[fileName]) {
        let meta = stampMetadata[fileName];
        let siteLink = document.createElement("a");
        siteLink.href = meta.url;
        siteLink.target = "_blank";
        siteLink.className = "modal-btn";
        siteLink.style.background = "#ffffff";
        siteLink.innerText = meta.name;
        rightContent.appendChild(siteLink);
      }

      let downloadBtn = document.createElement("a");
      downloadBtn.id = "downloadBtn";
      downloadBtn.href = imgPath;
      downloadBtn.download = "";
      downloadBtn.className = "modal-btn";
      downloadBtn.target = "_blank";
      downloadBtn.innerText = "Download Image";
      rightContent.appendChild(downloadBtn);

      let copyUrlBtn = document.createElement("button");
      copyUrlBtn.className = "modal-btn";
      copyUrlBtn.onclick = copyUrl;
      copyUrlBtn.innerText = "Copy Image URL";
      rightContent.appendChild(copyUrlBtn);

      let copyCodeBtn = document.createElement("button");
      copyCodeBtn.className = "modal-btn";
      copyCodeBtn.onclick = copyCode;
      copyCodeBtn.innerText = "Copy HTML Code";
      rightContent.appendChild(copyCodeBtn);

      document.getElementById('stampModal').classList.add('active');
    }

    function closeModal(event) {
      document.getElementById('stampModal').classList.remove('active');
    }

    function closeModalDirect() {
      document.getElementById('stampModal').classList.remove('active');
    }

    function copyUrl() {
      navigator.clipboard.writeText(currentImgSrc).then(() => {
        alert("Image URL copied to clipboard!");
      });
    }

    function copyCode() {
      let code = `<a href="https://cosmic-seea.neocities.org/" target="_blank">\n  <img src="${currentImgSrc}" alt="Stamp" style="border: none; box-shadow: none; display: block; max-width: 100%; height: auto;">\n</a>`;
      
      navigator.clipboard.writeText(code).then(() => {
        alert("HTML code copied to clipboard!");
      });
    }
  </script>

</body>
</html>
